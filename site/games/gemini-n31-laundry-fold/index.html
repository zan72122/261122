<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>🧺</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3e6d3;
      touch-action: none;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* Tiny stitched felt audio toggle button — zero text */
    #mute-btn {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      right: max(12px, env(safe-area-inset-right, 12px));
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2.5px dashed #fff8ee;
      background: #d9826c;
      box-shadow: 0 3px 8px rgba(90, 55, 35, 0.28), inset 0 1px 3px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.14s ease, background 0.2s ease;
      outline: none;
      padding: 0;
    }
    #mute-btn:active {
      transform: scale(0.9);
    }
    #mute-btn.muted {
      background: #9f9286;
    }
    #mute-btn svg {
      width: 24px;
      height: 24px;
      fill: #fff8ee;
      pointer-events: none;
    }
  </style>
<script src="../../gf-playlog.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <button id="mute-btn" type="button" aria-label="sound">
    <svg id="icon-sound-on" viewBox="0 0 24 24">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" />
    </svg>
    <svg id="icon-sound-off" viewBox="0 0 24 24" style="display:none;">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" opacity="0.45" />
      <path d="M4.2 4.2l15.6 15.6" stroke="#fff8ee" stroke-width="2.6" stroke-linecap="round" />
    </svg>
  </button>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
