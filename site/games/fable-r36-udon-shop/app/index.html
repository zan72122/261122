<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e9d6b8">
<title>うどんやさん</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9d6b8;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  /* 起動中：文字なし。生地色の丸がふくらむだけ */
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #e9d6b8; z-index: 5; }
  #boot i { width: 18vmin; height: 14vmin; border-radius: 50%; background: #f6eedc; box-shadow: 0 1.5vmin 0 #d8c3a0;
    animation: b 0.9s ease-in-out infinite alternate; }
  @keyframes b { from { transform: scale(0.9, 1.05); } to { transform: scale(1.08, 0.92); } }
</style>
</head>
<body>
<div id="boot"><i></i></div>
<!-- file:// でも動くよう、すべて classic script（npm run build で生成） -->
<script src="vendor/three.min.js"></script>
<script src="hero/hero.build.js"></script>
<script src="shell/shell.build.js"></script>
</body>
</html>
