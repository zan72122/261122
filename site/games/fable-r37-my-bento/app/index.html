<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6e7d2">
<title>わたしのお弁当</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6e7d2; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  /* boot: a hopping bento icon, no text */
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f6e7d2; transition: opacity .35s; z-index: 5; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot svg { width: 120px; height: 120px; animation: hop .7s ease-in-out infinite alternate; }
  @keyframes hop { from { transform: translateY(0) scale(1, .96); } to { transform: translateY(-18px) scale(.97, 1.03); } }
  /* iris wipe between scenes */
  #iris { position: fixed; left: 50%; top: 50%; width: 300vmax; height: 300vmax; transform: translate(-50%, -50%); border-radius: 50%;
          box-shadow: 0 0 0 300vmax #ffd6a8; pointer-events: none; z-index: 4; display: none; }
  #iris.on { display: block; pointer-events: auto; }
  /* "again": round button with a circular arrow, no text */
  #again { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 104px; height: 104px;
           border-radius: 50%; border: 6px solid #ff8fb1; background: #fff; box-shadow: 0 6px 0 #e86f95, 0 10px 18px rgba(120,60,40,.25);
           display: flex; align-items: center; justify-content: center; padding: 0; z-index: 3; touch-action: none;
           transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1); cursor: pointer; }
  #again.show { transform: scale(.85); }
  #again.big { transform: scale(1.08); animation: pulse 1.1s ease-in-out infinite; }
  #again.nudge { animation: wiggle .6s ease-in-out 2; }
  #again svg { width: 66px; height: 66px; }
  @keyframes pulse { 0%,100% { transform: scale(1.0); } 50% { transform: scale(1.14) rotate(-6deg); } }
  @keyframes wiggle { 0%,100% { transform: scale(1.05) rotate(0); } 30% { transform: scale(1.15) rotate(-12deg); } 60% { transform: scale(1.15) rotate(12deg); } }
  #dbg { position: fixed; left: 6px; top: 6px; margin: 0; padding: 6px 8px; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #fff;
         background: rgba(0,0,0,.55); border-radius: 6px; z-index: 10; pointer-events: none; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot" aria-hidden="true">
  <svg viewBox="0 0 120 120"><rect x="14" y="40" width="92" height="56" rx="14" fill="#d9362b"/><rect x="22" y="48" width="76" height="40" rx="9" fill="#fff6ea"/>
    <path d="M38 80 L48 58 L58 80 Z" fill="#fff" stroke="#ddd"/><rect x="40" y="73" width="16" height="7" fill="#2b3a2b"/><circle cx="72" cy="68" r="8" fill="#e8342a"/><ellipse cx="86" cy="74" rx="8" ry="6" fill="#f3c33b"/>
    <rect x="10" y="26" width="100" height="16" rx="8" fill="#ff8fb1"/></svg>
</div>
<div id="iris"></div>
<button id="again" aria-label="もう1回">
  <svg viewBox="0 0 64 64"><path d="M32 10a22 22 0 1 0 21 15" fill="none" stroke="#ff6f9a" stroke-width="8" stroke-linecap="round"/>
    <path d="M44 4 L58 22 L36 24 Z" fill="#ff6f9a"/><rect x="22" y="28" width="20" height="13" rx="4" fill="#ffc94a"/></svg>
</button>
<script>
  // file:// cannot hand <img> pixels to WebGL in some browsers: load the same JPEGs as data URIs there.
  if (location.protocol === 'file:') document.write('<script src="assets/textures.js"><\/script>');
</script>
<script src="vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/geom.js"></script>
<script src="js/foods.js"></script>
<script src="js/kitchen.js"></script>
<script src="js/picnic.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
</body>
</html>
