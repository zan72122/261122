<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>🍳</title>
  <link rel="stylesheet" href="./style.css">
<script src="../../gf-playlog.js" defer></script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <button id="sound-btn" type="button" aria-label="sound">
    <svg id="sound-icon-on" viewBox="0 0 36 36" width="28" height="28" fill="none" stroke="#241612" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 14h6l8-6v20l-8-6H6z" fill="#fff6e3"/>
      <path d="M25 13c2 2.5 2 7.5 0 10"/>
      <path d="M29 9.5c3.6 4.5 3.6 12.5 0 17"/>
    </svg>
    <svg id="sound-icon-off" viewBox="0 0 36 36" width="28" height="28" fill="none" stroke="#241612" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <path d="M6 14h6l8-6v20l-8-6H6z" fill="#f0d9c8"/>
      <path d="M24 13l8 10M32 13l-8 10" stroke="#d9453a"/>
    </svg>
  </button>
  <script type="module" src="./js/main.js"></script>
