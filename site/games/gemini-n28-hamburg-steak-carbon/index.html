<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>🍳</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fdf3e3;
      touch-action: none;
      overscroll-behavior: none;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* Soft anime-film watercolor paper edge glow (pure visual atmosphere, zero text/icons) */
    #paper-frame {
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 42px rgba(244, 198, 148, 0.34),
        inset 0 0 10px rgba(215, 152, 98, 0.18);
      z-index: 2;
    }
  </style>
<script src="../../gf-playlog.js" defer></script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="paper-frame"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
