<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#a8dcff">
<title>ごみしゅうしゅうしゃ</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a8dcff; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
  #fade { position: fixed; inset: 0; background: #a8dcff; opacity: 0; pointer-events: none; z-index: 10; }
  /* boot: a bouncing ball, no text */
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; background: #a8dcff; }
  #boot i { width: 56px; height: 56px; border-radius: 50%; background: #4cd07d; animation: b .6s ease-in-out infinite alternate; box-shadow: 0 30px 0 -20px rgba(0,0,0,.15); }
  #boot.failed i { background: #ff8a8a; animation: none; }
  @keyframes b { from { transform: translateY(-30px) scale(1, 1); } to { transform: translateY(20px) scale(1.15, .85); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fade"></div>
<div id="boot"><i></i></div>
<script>
// Boot: prefer the ES modules (http(s), Safari/Firefox file://). If the module graph cannot load
// (Chrome on file:// blocks module scripts), fall back to the classic one-file build in classic/.
// On file:// the textures come from classic/textures.data.js (base64), because WebGL may refuse file:// images.
(function () {
  var isFile = location.protocol === 'file:';
  function add(src, module, onload, onerror) {
    var s = document.createElement('script');
    if (module) s.type = 'module';
    s.src = src;
    if (onload) s.onload = onload;
    if (onerror) s.onerror = onerror;
    document.head.appendChild(s);
  }
  function classic() {
    if (window.__BOOT_MODE__ === 'classic') return;
    window.__BOOT_MODE__ = 'classic';
    add('hero/hero.classic.js', false, function () { add('classic/shell.classic.js', false); });
  }
  function modules() {
    window.__BOOT_MODE__ = 'module';
    add('shell/main.js', true, null, classic);
  }
  if (isFile) add('classic/textures.data.js', false, modules, modules); else modules();
})();
</script>
</body>
</html>
