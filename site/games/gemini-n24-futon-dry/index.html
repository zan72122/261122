<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Sunny Futon</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #c8dff2;
      touch-action: none;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #curtain {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 55% 30%, #f5f9fd 0%, #c9dff3 100%);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.65s ease-out;
      z-index: 10;
    }
    #curtain.ready {
      opacity: 0;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
<script src="../../gf-playlog.js" defer></script>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="curtain"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
