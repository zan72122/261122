<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7e6d6">
<title>ミックスジュース</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7e6d6; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  /* "again" button: a round button with a circular arrow, no text */
  #again { position: fixed; right: max(2.5vmin, env(safe-area-inset-right)); bottom: max(2.5vmin, env(safe-area-inset-bottom)); width: 17vmin; height: 17vmin;
    min-width: 84px; min-height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6a8, #ffc93c 60%, #f5a623);
    box-shadow: 0 1.2vmin 0 #d98a12, 0 2vmin 3vmin rgba(120, 60, 0, .3); display: flex; align-items: center; justify-content: center;
    transform: scale(0); transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); z-index: 5; cursor: pointer; touch-action: none; }
  #again.show { transform: scale(1); }
  #again.show.pulse { animation: pulse 1s ease-in-out infinite; }
  #again svg { width: 62%; height: 62%; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12) rotate(-8deg); } }
  #loader { position: fixed; inset: 0; background: #f7e6d6; display: flex; align-items: center; justify-content: center; z-index: 10; transition: opacity .5s; }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader .b { width: 12vmin; height: 12vmin; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb3c1, #ff5c7a); animation: hop .6s ease-in-out infinite alternate; }
  #loader .b:nth-child(2) { background: radial-gradient(circle at 35% 30%, #ffe08a, #ffb020); animation-delay: .2s; margin: 0 3vmin; }
  #loader .b:nth-child(3) { background: radial-gradient(circle at 35% 30%, #c8f08a, #6cc040); animation-delay: .4s; }
  #loader.nogl .b { animation: none; opacity: .4; }
  @keyframes hop { from { transform: translateY(2vmin); } to { transform: translateY(-3vmin); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="again" aria-label="again"><svg viewBox="0 0 100 100"><path d="M50 18a32 32 0 1 1-30.4 22" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/><path d="M6 30 L24 52 L38 26 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg></div>
<div id="loader"><div class="b"></div><div class="b"></div><div class="b"></div></div>
<script src="vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/geom.js"></script>
<script src="js/shaders.js"></script>
<script src="js/scene.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
